name: Importar copia de Diario Federal

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio original a una rama independiente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch main --single-branch https://github.com/Alvarorfontana/diario.git source
          cd source
          rm -rf .github/workflows
          git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:refs/heads/cloudflare-copy
